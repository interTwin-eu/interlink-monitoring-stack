apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: {{ .Release.Namespace }}
data:
  tempo.yaml: |
    stream_over_http_enabled: true
    server:
      http_listen_address: 0.0.0.0
      http_listen_port: 3200
      log_level: debug

    query_frontend:
      search:
        duration_slo: 5s
        throughput_bytes_slo: 1.073741824e+09
      trace_by_id:
        duration_slo: 300s

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"

    ingester:
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 876000h

    metrics_generator:
      registry:
        external_labels:
          source: tempo
          cluster: your-cluster
      
      storage:
        path: /var/tempo/generator/wal
        remote_write:
          - url: http://localhost:9090/api/v1/write
            send_exemplars: true
      
      processor:
        span_metrics:
          enable_target_info: true
          dimensions:
            - name
            - resource.service.name
            - span.exit.code
        
        service_graphs: {}

      traces_storage:
        path: /var/tempo/generator/traces

    overrides:
      defaults:
        metrics_generator:
          processors:
            - span-metrics
            - service-graphs
          generate_native_histograms: both

    storage:
      trace:
        pool:
          max_workers: 100
          # A trace-by-ID lookup enqueues one job per block in the blocklist, so
          # queue_depth has to stay comfortably above the number of blocks or
          # the lookup is rejected outright with "queue doesn't have room for N
          # jobs". 10000 is the Tempo default.
          queue_depth: 10000
        backend: s3
        s3:
          bucket: {{ .Values.config.tempo.s3.bucket }}
          endpoint: {{ .Values.config.tempo.s3.endpoint }}
          access_key: {{ .Values.config.tempo.s3.access_key }}
          secret_key: {{ .Values.config.tempo.s3.secret_key }}