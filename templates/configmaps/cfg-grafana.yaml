{{/*
Dashboards are generated from templates/_dashboards.tpl: one dashboard per HTTP
operation, plus a separate one for the failed (exit.code != 200) case. Each
service gets a single ConfigMap holding all of its dashboards, mounted as a
directory so Grafana's file provider puts them in a folder named after the
service.

The span names below come from the instrumentation in the interLink source:
  *HttpCall  pkg/virtualkubelet/execute.go        (VK -> interLink API)
  *API       pkg/interlink/api/*.go               (interLink API -> plugin)
  bare names plugins/slurm/pkg/slurm/*.go         (inside the plugin)
"selects" lists the attributes each span actually carries; they are pulled into
the traces table with select().
*/}}
{{- $ds := "1" -}}

{{- $vkOps := list
  (dict "span" "CreateHttpCall" "label" "Create" "selects" (list "span.pod.name" "span.pod.namespace" "span.pod.uid"))
  (dict "span" "DeleteHttpCall" "label" "Delete" "selects" (list "span.pod.name" "span.pod.namespace" "span.pod.uid"))
  (dict "span" "StatusHttpCall" "label" "Status" "selects" (list))
  (dict "span" "LogHttpCall" "label" "Logs" "selects" (list "span.pod.name" "span.pod.namespace" "span.pod.uid"))
  (dict "span" "PingHttpCall" "label" "Ping" "selects" (list))
-}}

{{- $apiOps := list
  (dict "span" "CreateAPI" "label" "Create" "selects" (list "span.pod.name" "span.pod.namespace" "span.pod.uid" `span."X-Forwarded-User"` `span."X-Forwarded-Email"`))
  (dict "span" "DeleteAPI" "label" "Delete" "selects" (list "span.pod.name" "span.pod.namespace" "span.pod.uid" `span."X-Forwarded-User"` `span."X-Forwarded-Email"`))
  (dict "span" "StatusAPI" "label" "Status" "selects" (list "span.pods.count" "span.pod.name" "span.pod.namespace" "span.pod.uid" "span.pod.phase" `span."X-Forwarded-User"` `span."X-Forwarded-Email"`))
  (dict "span" "GetLogsAPI" "label" "Logs" "selects" (list "span.pod.name" "span.pod.namespace" "span.opts.tail" "span.opts.follow" `span."X-Forwarded-User"` `span."X-Forwarded-Email"`))
  (dict "span" "PingAPI" "label" "Ping" "selects" (list `span."X-Forwarded-User"` `span."X-Forwarded-Email"`))
-}}

{{- $pluginOps := list
  (dict "span" "Create" "label" "Create" "selects" (list "span.job.limits.cpu" "span.job.limits.memory"))
  (dict "span" "Delete" "label" "Delete" "selects" (list))
  (dict "span" "Status" "label" "Status" "selects" (list))
  (dict "span" "GetLogs" "label" "Logs" "selects" (list "span.pod.name" "span.pod.namespace"))
  (dict "span" "SystemInfo" "label" "SystemInfo" "selects" (list))
-}}

{{- range $index, $service := .Values.config.grafana.servicesVKInterLink }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafanadashboardhttp{{ $index }}
  namespace: {{ $.Release.Namespace }}   # Use $ to access the top-level context
  labels:
    grafana_dashboard: "{{ $index }}"
data:
{{ include "interlink-mon.serviceDashboards" (dict "service" $service "family" "vk-interlink" "ops" $vkOps "ds" $ds) }}
---
{{ end }}

{{- range $index, $service := .Values.config.grafana.servicesInterLinkPlugin }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafanadashboardhttpinterlinktoplugin{{ $index }}
  namespace: {{ $.Release.Namespace }}
  labels:
    grafana_dashboard: "{{ $index }}"
data:
{{ include "interlink-mon.serviceDashboards" (dict "service" $service "family" "interlink-plugin" "ops" $apiOps "ds" $ds) }}
---
{{ end }}

{{- range $index, $service := .Values.config.grafana.servicesPlugin }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafanadashboardhttpplugin{{ $index }}
  namespace: {{ $.Release.Namespace }}
  labels:
    grafana_dashboard: "{{ $index }}"
data:
{{ include "interlink-mon.serviceDashboards" (dict "service" $service "family" "plugin" "ops" $pluginOps "ds" $ds) }}
---
{{ end }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafanadashboardk8s
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  dashboardK8S.json: |
    # WIP: to do

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: {{ .Release.Namespace }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'General'
        type: file
        options:
          path: /var/lib/grafana/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-grafana-datasources
  namespace: {{ .Release.Namespace }}
data:
  ds.yaml: |-
    {
        "apiVersion": 1,
        "datasources": [
            {
              "uid":"1",
              "name": "tempo",
              "type": "tempo",
              "url": "http://localhost:3200"
            },
            {
              "uid":"2",
              "name": "prometheus",
              "type": "prometheus",
              "url": "http://localhost:9090",
              "isDefault": true
            }
        ]
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: {{ .Release.Namespace }}
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          # One sub-directory per service; foldersFromFilesStructure turns each
          # of them into a Grafana folder.
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: true
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: {{ .Release.Namespace }}
data:
  grafana.ini: |

    [security]
    admin_user = {{ .Values.config.grafana.admin_user }}
    admin_password = {{ .Values.config.grafana.admin_password }}

    [server]
    http_addr = {{ .Values.config.grafana.http_addr }}
    http_port = {{ .Values.config.grafana.http_port }}
