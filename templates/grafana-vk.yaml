apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafanavk
  namespace: {{ .Release.Namespace }}
  labels:
    app: grafanavk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafanavk
  template:
    metadata:
      labels:
        app: grafanavk
    spec:
      initContainers:
      - name: init
        image: grafana/tempo:2.7.1
        command: ["chown", "10001:10001", "/var/tempo"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: tempo-data
          mountPath: /var/tempo
      containers:
      - name: tempo
        image: grafana/tempo:2.7.1
        command: ["/bin/sh", "-c"]
        args: ["until wget -q -O /dev/null http://localhost:9090/-/ready; do sleep 2; done && exec /tempo -config.file=/etc/tempo.yaml"]
        ports:
        - containerPort: 9095
        - containerPort: 4317
        - containerPort: 4318
        - containerPort: 4319
        - containerPort: 3200
        volumeMounts:
        - name: config-volume
          mountPath: /etc/tempo.yaml
          subPath: tempo.yaml
        - name: tempo-data
          mountPath: /var/tempo
      - name: prometheus
        image: prom/prometheus:v3.4.1
        args:
          - "--config.file=/etc/prometheus/prometheus.yaml"
          - "--web.enable-remote-write-receiver"
          - "--storage.tsdb.retention.time=30d"
          - "--enable-feature=native-histograms"
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/prometheus.yaml
          subPath: prometheus.yaml
        - name: prometheus-data
          mountPath: /prometheus
      - name: grafanavk
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SERVER_HTTP_ADDR
          value: "0.0.0.0"
        - name: GF_PROVISIONING_ENABLED
          value: "true"
        - name: GF_DASHBOARDS_JSON_ENABLED
          value: "true"
        volumeMounts:
        # Each ConfigMap is mounted as a whole directory: it now holds one JSON
        # file per HTTP operation, and the provider turns each directory into a
        # Grafana folder named after the service.
        {{- range $index, $service := .Values.config.grafana.servicesVKInterLink }}
          - name: grafanadashboardhttp{{ $index }}
            mountPath: /var/lib/grafana/dashboards/{{ $service }}
            readOnly: true
        {{- end }}
        {{- range $index, $service := .Values.config.grafana.servicesInterLinkPlugin }}
          - name: grafanadashboardhttpinterlinktoplugin{{ $index }}
            mountPath: /var/lib/grafana/dashboards/{{ $service }}
            readOnly: true
        {{- end }}
        {{- range $index, $service := .Values.config.grafana.servicesPlugin }}
          - name: grafanadashboardhttpplugin{{ $index }}
            mountPath: /var/lib/grafana/dashboards/{{ $service }}
            readOnly: true
        {{- end }}
          - name: grafanadashboardk8s
            mountPath: /var/lib/grafana/dashboards/k8s
            readOnly: true
          - mountPath: /etc/grafana/provisioning/datasources
            name: grafana-datasources
            readOnly: false
          - name: grafana-dashboard-providers
            mountPath: /etc/grafana/provisioning/dashboards/provider.yaml
            subPath: provider.yaml
          - name: grafana-config
            mountPath: /etc/grafana/grafana.ini
            subPath: grafana.ini
      volumes:
      - name: config-volume
        configMap:
          name: tempo-config
      - name: tempo-data
        hostPath:
          path: /tmp
          type: Directory
      - name: grafana-dashboard-providers
        configMap:
          name: grafana-dashboard-providers
      - name: grafana-datasources
        configMap:
          defaultMode: 420
          name: my-grafana-datasources
      {{- range $index, $service := .Values.config.grafana.servicesVKInterLink }}
      - name: grafanadashboardhttp{{ $index }}
        configMap:
          name: grafanadashboardhttp{{ $index }}
      {{- end }}
      {{- range $index, $service := .Values.config.grafana.servicesInterLinkPlugin }}
      - name: grafanadashboardhttpinterlinktoplugin{{ $index }}
        configMap:
          name: grafanadashboardhttpinterlinktoplugin{{ $index }}
      {{- end }}
      {{- range $index, $service := .Values.config.grafana.servicesPlugin }}
      - name: grafanadashboardhttpplugin{{ $index }}
        configMap:
          name: grafanadashboardhttpplugin{{ $index }}
      {{- end }}
      - name: grafanadashboardk8s
        configMap:
          name: grafanadashboardk8s
      - name: grafana-config
        configMap:
          name: grafana-config
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-data
        emptyDir: {}
